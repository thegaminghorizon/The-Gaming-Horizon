# =============================================================================
# THE GAMING HORIZON
# Continuous Integration Workflow
# =============================================================================
#
# Application directory:
# THE-GAMING-HORIZON/
#
# Platform:
# Next.js / TypeScript / npm
#
# Purpose:
# Validate dependencies, run available quality checks, and verify that the
# Gaming Horizon application can build successfully.
#
# =============================================================================

name: The Gaming Horizon CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Prevent multiple outdated runs for the same branch or pull request.
concurrency:
  group: gaming-horizon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only repository access is sufficient for this validation workflow.
permissions:
  contents: read

# All npm and application commands run from the actual Next.js application.
defaults:
  run:
    working-directory: THE-GAMING-HORIZON
    shell: bash

env:
  CI: true

jobs:
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # Repository
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Node.js
      # -----------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: THE-GAMING-HORIZON/package-lock.json

      - name: Display runtime information
        run: |
          echo "Node.js:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "Working directory:"
          pwd

      # -----------------------------------------------------------------------
      # Package validation
      # -----------------------------------------------------------------------

      - name: Validate package files
        run: |
          echo "Validating package.json and package-lock.json..."

          test -f package.json || {
            echo "::error::THE-GAMING-HORIZON/package.json was not found."
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::THE-GAMING-HORIZON/package-lock.json was not found."
            exit 1
          }

          node <<'NODE'
          const fs = require("fs");

          function readJson(file) {
            try {
              return JSON.parse(fs.readFileSync(file, "utf8"));
            } catch (error) {
              console.error(`::error::${file} is not valid JSON.`);
              console.error(error.message);
              process.exit(1);
            }
          }

          const packageJson = readJson("package.json");
          const packageLock = readJson("package-lock.json");

          if (!packageJson.scripts) {
            console.error("::error::package.json does not contain a scripts section.");
            process.exit(1);
          }

          if (!packageJson.scripts.build) {
            console.error('::error::package.json does not contain a "build" script.');
            process.exit(1);
          }

          if (
            typeof packageLock.lockfileVersion !== "number" ||
            packageLock.lockfileVersion < 1
          ) {
            console.error(
              "::error::package-lock.json does not contain a valid lockfileVersion."
            );
            console.error(
              "Regenerate package-lock.json with npm install before running CI."
            );
            process.exit(1);
          }

          console.log("package.json: valid");
          console.log("package-lock.json: valid");
          console.log(`lockfileVersion: ${packageLock.lockfileVersion}`);
          console.log(`build script: ${packageJson.scripts.build}`);
          NODE

      # -----------------------------------------------------------------------
      # Dependencies
      # -----------------------------------------------------------------------

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Quality checks
      # -----------------------------------------------------------------------

      - name: Run lint
        run: npm run lint --if-present

      - name: Run type checking
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test --if-present

      # -----------------------------------------------------------------------
      # Production build
      # -----------------------------------------------------------------------

      - name: Build The Gaming Horizon
        run: npm run build

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------

      - name: Create CI summary
        if: success()
        run: |
          {
            echo "# The Gaming Horizon CI"
            echo ""
            echo "✅ Repository validation completed successfully."
            echo ""
            echo "### Environment"
            echo ""
            echo "- Application: \`THE-GAMING-HORIZON/\`"
            echo "- Node.js: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo ""
            echo "### Checks"
            echo ""
            echo "- ✅ Package files validated"
            echo "- ✅ Dependencies installed with \`npm ci\`"
            echo "- ✅ Available lint checks completed"
            echo "- ✅ Available type checks completed"
            echo "- ✅ Available tests completed"
            echo "- ✅ Production build completed"
          } >> "$GITHUB_STEP_SUMMARY"
