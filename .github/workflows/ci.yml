# =============================================================================
#                              GAMING HORIZON
#                         BEYOND THE HORIZON
# =============================================================================
#
#                      CONTINUOUS INTEGRATION
#
#                       .github/workflows/ci.yml
#
#                         CI SYSTEM v1.0.0
#
# =============================================================================
#
# PURPOSE
# -------
# Validates The Gaming Horizon repository whenever code is pushed to the
# main branch or proposed through a pull request.
#
# CI PIPELINE
# -----------
#
#   PUSH / PULL REQUEST
#           │
#           ▼
#       CHECKOUT
#           │
#           ▼
#       SETUP NODE
#           │
#           ▼
#    INSTALL DEPENDENCIES
#           │
#           ▼
#         LINT
#           │
#           ▼
#      TYPE CHECK
#           │
#           ▼
#         TEST
#           │
#           ▼
#         BUILD
#           │
#           ▼
#       CI COMPLETE
#
# SECURITY
# --------
# - Uses read-only repository permissions.
# - Does not hard-code credentials.
# - Does not expose deployment secrets.
# - Cancels obsolete runs for the same branch / pull request.
#
# =============================================================================


name: "The Gaming Horizon CI"


# =============================================================================
# TRIGGERS
# =============================================================================

on:

  # Run whenever changes are pushed directly to the main branch.
  push:
    branches:
      - main

  # Run for pull requests targeting the main branch.
  pull_request:
    branches:
      - main

  # Allow maintainers to run CI manually from the GitHub Actions interface.
  workflow_dispatch:


# =============================================================================
# PERMISSIONS
# =============================================================================
#
# CI only needs to read repository contents.
#
# Additional permissions should be added only if a future workflow step
# genuinely requires them.
#

permissions:
  contents: read


# =============================================================================
# CONCURRENCY
# =============================================================================
#
# If several commits are pushed rapidly to the same branch or pull request,
# cancel the older CI run and validate the newest version instead.
#

concurrency:
  group: "gaming-horizon-ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true


# =============================================================================
# ENVIRONMENT
# =============================================================================

env:

  # Disable Next.js telemetry during automated CI execution.
  NEXT_TELEMETRY_DISABLED: "1"

  # Standard CI environment flag used by many Node.js tools.
  CI: "true"


# =============================================================================
# JOBS
# =============================================================================

jobs:

  # ---------------------------------------------------------------------------
  # QUALITY & BUILD
  # ---------------------------------------------------------------------------

  validate:

    name: "Validate & Build"

    runs-on: ubuntu-latest

    timeout-minutes: 20


    # -------------------------------------------------------------------------
    # STEPS
    # -------------------------------------------------------------------------

    steps:


      # =======================================================================
      # CHECKOUT
      # =======================================================================

      - name: "Checkout repository"
        uses: actions/checkout@v4


      # =======================================================================
      # NODE.JS
      # =======================================================================

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:

          # Stable Node.js runtime for the Gaming Horizon CI environment.
          node-version: "22"

          # Reuse npm's package cache between CI runs.
          cache: "npm"

          # Ensures the cache changes whenever dependencies change.
          cache-dependency-path: "package-lock.json"


      # =======================================================================
      # ENVIRONMENT INFORMATION
      # =======================================================================

      - name: "Display runtime information"
        run: |
          echo "=========================================="
          echo "THE GAMING HORIZON"
          echo "Continuous Integration"
          echo "=========================================="
          echo
          echo "Node:"
          node --version
          echo
          echo "npm:"
          npm --version
          echo
          echo "Runner:"
          uname -a


      # =======================================================================
      # PACKAGE VALIDATION
      # =======================================================================

      - name: "Validate package files"
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "package.json" ]; then
            echo "::error::package.json was not found in the repository root."
            exit 1
          fi

          if [ ! -f "package-lock.json" ]; then
            echo "::error::package-lock.json was not found in the repository root."
            exit 1
          fi

          echo "package.json found."
          echo "package-lock.json found."
          echo "Package metadata validation completed."


      # =======================================================================
      # DEPENDENCIES
      # =======================================================================

      - name: "Install dependencies"
        run: npm ci


      # =======================================================================
      # LINT
      # =======================================================================
      #
      # Runs the lint script when it exists.
      #
      # Example package.json:
      #
      # "scripts": {
      #   "lint": "eslint ."
      # }
      #

      - name: "Run lint"
        run: npm run lint --if-present


      # =======================================================================
      # TYPE CHECK
      # =======================================================================
      #
      # Runs an explicit typecheck script if one exists.
      #
      # This makes CI ready for a future package.json script such as:
      #
      # "typecheck": "tsc --noEmit"
      #

      - name: "Run type checking"
        run: npm run typecheck --if-present


      # =======================================================================
      # TESTS
      # =======================================================================
      #
      # Tests run automatically once a test script exists.
      #
      # This prevents CI from failing solely because the project does not yet
      # define an automated test command.
      #

      - name: "Run tests"
        run: npm test --if-present


      # =======================================================================
      # PRODUCTION BUILD
      # =======================================================================
      #
      # The production build is the strongest general validation that the
      # application can compile successfully.
      #

      - name: "Build The Gaming Horizon"
        run: npm run build


      # =======================================================================
      # CI SUMMARY
      # =======================================================================

      - name: "Create CI summary"
        if: success()
        shell: bash
        run: |
          {
            echo "# ✅ The Gaming Horizon CI"
            echo
            echo "**Status:** Passed"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Repository checkout | ✅ |"
            echo "| Node.js environment | ✅ |"
            echo "| Dependency installation | ✅ |"
            echo "| Lint | ✅ / script optional |"
            echo "| Type checking | ✅ / script optional |"
            echo "| Tests | ✅ / script optional |"
            echo "| Production build | ✅ |"
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "**Branch / Ref:** \`${GITHUB_REF_NAME}\`"
            echo
            echo "---"
            echo
            echo "*Gaming Horizon · Beyond the Horizon*"
          } >> "$GITHUB_STEP_SUMMARY"


      # =======================================================================
      # FAILURE SUMMARY
      # =======================================================================

      - name: "Create failure summary"
        if: failure()
        shell: bash
        run: |
          {
            echo "# ❌ The Gaming Horizon CI"
            echo
            echo "**Status:** Failed"
            echo
            echo "One or more repository validation steps did not complete successfully."
            echo
            echo "Review the failed workflow step above for the exact error."
            echo
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "**Branch / Ref:** \`${GITHUB_REF_NAME}\`"
            echo
            echo "---"
            echo
            echo "*Build what matters. Fix what breaks. Improve what remains.*"
          } >> "$GITHUB_STEP_SUMMARY"
