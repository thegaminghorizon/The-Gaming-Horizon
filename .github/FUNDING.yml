# THE GAMING HORIZON
# ------------------
#
# Official repository funding configuration for The Gaming Horizon.
#
# This file powers GitHub's repository Sponsor / funding interface and
# directs supporters toward the official Gaming Horizon Support Us experience.
#
#
#                          SUPPORT FLOW
#
#                    THE GAMING HORIZON
#                            │
#                            ▼
#                     GITHUB REPOSITORY
#                            │
#                            ▼
#                        SUPPORT
#                            │
#                            ▼
#                       FUNDING.yml
#                            │
#                            ▼
#                 OFFICIAL SUPPORT US PAGE
#
#
# OFFICIAL DESTINATION
# --------------------
#
# https://thegaminghorizon.netlify.app/support-us
#
#
# FUNDING PRINCIPLES
# ------------------
#
# 01 — OFFICIAL
#      Only destinations officially operated by The Gaming Horizon should
#      appear in this file.
#
# 02 — DIRECT
#      Supporters should be directed to a clear first-party destination.
#
# 03 — TRANSPARENT
#      Do not list unverified sponsorship platforms or payment destinations.
#
# 04 — SECURE
#      Never place credentials, API keys, payment secrets, tokens, or private
#      financial configuration inside this repository.
#
# 05 — MAINTAINABLE
#      Funding configuration should remain intentionally small and easy to
#      verify.
#
# 06 — CONSISTENT
#      The official Support Us page remains the central funding destination
#      for the Gaming Horizon ecosystem.
#
#
# IMPORTANT
# ---------
#
# FUNDING.yml is configuration, not a presentation document.
#
# GitHub controls how funding links are displayed in the repository interface.
# Comments, branding text, diagrams, and documentation in this file are useful
# for maintainers but are not rendered inside GitHub's Sponsor popup.
#
#
# DO NOT ADD UNVERIFIED PROVIDERS
# ------------------------------
#
# Do not enable any provider unless The Gaming Horizon officially operates
# an account on that platform.
#
# Examples of supported GitHub FUNDING.yml providers may include:
#
# github
# patreon
# open_collective
# ko_fi
# tidelift
# community_bridge
# liberapay
# issuehunt
# polar
# buy_me_a_coffee
# thanks_dev
#
# These remain intentionally unused until officially configured.
#
#
# SECURITY
# --------
#
# This file must never contain:
#
# - passwords;
# - payment credentials;
# - private API keys;
# - access tokens;
# - private keys;
# - bank information;
# - payment processor secrets;
# - webhook secrets;
# - authentication credentials;
# - private supporter information.
#
#
# GOVERNANCE
# ----------
#
# Any future funding destination should be reviewed for:
#
# - ownership;
# - authenticity;
# - security;
# - project alignment;
# - destination accuracy;
# - long-term maintainability.
#
#
