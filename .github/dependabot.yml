# =============================================================================
#                              GAMING HORIZON
#                         BEYOND THE HORIZON
# =============================================================================
#
#                              DEPENDABOT
#
#                         .github/dependabot.yml
#
#                     DEPENDENCY SYSTEM v1.0.0
#
# =============================================================================
#
# PURPOSE
# -------
# Configures GitHub Dependabot for The Gaming Horizon repository.
#
# Dependabot helps identify and propose updates for:
#
# - npm production dependencies;
# - npm development dependencies;
# - framework dependencies;
# - TypeScript tooling;
# - build tooling;
# - GitHub Actions used by repository workflows.
#
#
# CURRENT REPOSITORY
# ------------------
#
# Owner:
# thegaminghorizon
#
# Repository:
# The-Gaming-Horizon
#
# Default branch:
# main
#
# Application directory:
# THE-GAMING-HORIZON/
#
# Package manager:
# npm
#
# Application manifest:
# THE-GAMING-HORIZON/package.json
#
# Application lockfile:
# THE-GAMING-HORIZON/package-lock.json
#
#
# DEPENDENCY FLOW
# ---------------
#
#                       REPOSITORY
#                           │
#                           ▼
#                      DEPENDABOT
#                           │
#               ┌───────────┴───────────┐
#               ▼                       ▼
#              NPM                GITHUB ACTIONS
#               │                       │
#               ▼                       ▼
#     THE-GAMING-HORIZON/         .github/workflows/
#               │                       │
#               ▼                       ▼
#          CHECK VERSIONS          CHECK ACTIONS
#               │                       │
#               └───────────┬───────────┘
#                           ▼
#                     UPDATE FOUND
#                           │
#                           ▼
#                     CREATE PR
#                           │
#                           ▼
#                       RUN CI
#                           │
#                           ▼
#                    OWNER REVIEW
#                           │
#                    ┌──────┴──────┐
#                    ▼             ▼
#                  MERGE         DECLINE
#
#
# IMPORTANT
# ---------
#
# Dependabot does NOT automatically mean an update should be merged.
#
# Every dependency update should still be evaluated for:
#
# - compatibility;
# - security;
# - breaking changes;
# - build success;
# - runtime behavior;
# - framework compatibility;
# - project requirements;
# - maintenance impact.
#
#
# SECURITY
# --------
#
# This file must never contain:
#
# - npm authentication tokens;
# - API keys;
# - private repository credentials;
# - deployment secrets;
# - Supabase secrets;
# - Netlify tokens;
# - private access tokens.
#
# =============================================================================

version: 2

updates:

  # ===========================================================================
  # NPM / NODE.JS DEPENDENCIES
  # ===========================================================================
  #
  # Monitors:
  #
  # THE-GAMING-HORIZON/package.json
  # THE-GAMING-HORIZON/package-lock.json
  #
  # The main Next.js application lives inside:
  #
  # /THE-GAMING-HORIZON
  #
  # Therefore Dependabot must monitor that directory rather than the
  # repository root.
  #

  - package-ecosystem: "npm"
    directory: "/THE-GAMING-HORIZON"

    # -------------------------------------------------------------------------
    # SCHEDULE
    # -------------------------------------------------------------------------
    #
    # Weekly checks provide a reasonable balance between staying current and
    # avoiding unnecessary dependency-update noise.
    #

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    # -------------------------------------------------------------------------
    # TARGET BRANCH
    # -------------------------------------------------------------------------

    target-branch: "main"

    # -------------------------------------------------------------------------
    # PULL REQUEST LIMIT
    # -------------------------------------------------------------------------
    #
    # Prevent excessive numbers of simultaneous dependency pull requests.
    #

    open-pull-requests-limit: 5

    # -------------------------------------------------------------------------
    # REBASE STRATEGY
    # -------------------------------------------------------------------------

    rebase-strategy: "auto"

    # -------------------------------------------------------------------------
    # COMMIT MESSAGE
    # -------------------------------------------------------------------------
    #
    # Example:
    #
    # deps(deps): bump next
    #

    commit-message:
      prefix: "deps"
      include: "scope"

    # -------------------------------------------------------------------------
    # PULL REQUEST GROUPS
    # -------------------------------------------------------------------------
    #
    # Minor and patch dependency updates are grouped to reduce unnecessary
    # pull-request volume.
    #
    # Major updates remain separate so potentially breaking changes receive
    # focused review.
    #

    groups:

      # -----------------------------------------------------------------------
      # PRODUCTION DEPENDENCIES
      # -----------------------------------------------------------------------

      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      # -----------------------------------------------------------------------
      # DEVELOPMENT DEPENDENCIES
      # -----------------------------------------------------------------------

      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # ===========================================================================
  # GITHUB ACTIONS
  # ===========================================================================
  #
  # Monitors GitHub Actions referenced throughout:
  #
  # .github/workflows/
  #
  # The GitHub Actions ecosystem remains configured with:
  #
  # directory: "/"
  #
  # because Dependabot discovers repository workflows from the root-level
  # GitHub Actions configuration.
  #

  - package-ecosystem: "github-actions"
    directory: "/"

    # -------------------------------------------------------------------------
    # SCHEDULE
    # -------------------------------------------------------------------------

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Kolkata"

    # -------------------------------------------------------------------------
    # TARGET BRANCH
    # -------------------------------------------------------------------------

    target-branch: "main"

    # -------------------------------------------------------------------------
    # PULL REQUEST LIMIT
    # -------------------------------------------------------------------------

    open-pull-requests-limit: 3

    # -------------------------------------------------------------------------
    # REBASE STRATEGY
    # -------------------------------------------------------------------------

    rebase-strategy: "auto"

    # -------------------------------------------------------------------------
    # COMMIT MESSAGE
    # -------------------------------------------------------------------------

    commit-message:
      prefix: "ci"
      include: "scope"

    # -------------------------------------------------------------------------
    # GROUP GITHUB ACTION UPDATES
    # -------------------------------------------------------------------------
    #
    # GitHub Action version updates can generally be reviewed together.
    #

    groups:
      github-actions:
        patterns:
          - "*"

# =============================================================================
# DEPENDENCY MANAGEMENT STANDARD
# =============================================================================
#
# Dependabot provides update proposals.
#
# It does NOT replace:
#
# - CI;
# - testing;
# - security review;
# - CODEOWNERS review;
# - compatibility checks;
# - human judgment.
#
#
#                     DEPENDENCY UPDATE
#                            │
#                            ▼
#                       DEPENDABOT PR
#                            │
#                            ▼
#                       CI VALIDATION
#                            │
#              ┌─────────────┼─────────────┐
#              ▼             ▼             ▼
#            INSTALL        CHECK         BUILD
#              │             │             │
#              └─────────────┼─────────────┘
#                            ▼
#                       CODE REVIEW
#                            │
#                            ▼
#                    @thegaminghorizon
#                            │
#                    ┌───────┴───────┐
#                    ▼               ▼
#                  ACCEPT          REJECT
#                    │
#                    ▼
#                  MERGE
#
# =============================================================================
# UPDATE CLASSIFICATION
# =============================================================================
#
# PATCH
# -----
#
# Example:
#
# 1.0.0 -> 1.0.1
#
# Normally bug fixes and small maintenance updates.
#
#
# MINOR
# -----
#
# Example:
#
# 1.0.0 -> 1.1.0
#
# Normally backward-compatible functionality or improvements.
#
#
# MAJOR
# -----
#
# Example:
#
# 1.0.0 -> 2.0.0
#
# May contain breaking changes.
#
# Major dependency updates should receive individual review.
#
# =============================================================================
# REVIEW CHECKLIST
# =============================================================================
#
# Before merging a Dependabot pull request:
#
# [ ] Read dependency release notes where relevant.
# [ ] Check for breaking changes.
# [ ] Review security implications.
# [ ] Confirm package-lock.json remains valid.
# [ ] Confirm npm ci succeeds.
# [ ] Confirm available quality checks succeed.
# [ ] Confirm tests succeed when configured.
# [ ] Confirm the production build succeeds.
# [ ] Review UI behavior when framework packages change.
# [ ] Review browser behavior where relevant.
# [ ] Review deployment compatibility where relevant.
# [ ] Confirm the update does not introduce unwanted dependencies.
# [ ] Review CI before merging.
#
# =============================================================================
# HIGH-RISK DEPENDENCY CHANGES
# =============================================================================
#
# Pay additional attention when updates affect:
#
# FRAMEWORK
#   |
#   +-- Next.js
#
# RUNTIME
#   |
#   +-- Node.js-related tooling
#
# LANGUAGE
#   |
#   +-- TypeScript
#
# DATABASE
#   |
#   +-- Supabase-related packages
#
# BUILD
#   |
#   +-- compilation / bundling tools
#
# SECURITY
#   |
#   +-- authentication / validation libraries
#
# GITHUB
#   |
#   +-- workflow actions
#
# =============================================================================
# DO NOT AUTO-MERGE BLINDLY
# =============================================================================
#
# A newer version is not automatically a safer or better version for the
# current application.
#
# Dependency updates may change:
#
# API behavior
# BUILD OUTPUT
# BROWSER SUPPORT
# TYPES
# CONFIGURATION
# PERFORMANCE
# ACCESSIBILITY
# SECURITY
# DEPLOYMENT
#
# Preferred process:
#
# DETECT
#   |
#   v
# REVIEW
#   |
#   v
# VALIDATE
#   |
#   v
# TEST
#   |
#   v
# MERGE
#
# =============================================================================
# DEPENDENCY SECURITY
# =============================================================================
#
# Dependency maintenance is one part of repository security.
#
# It should work alongside:
#
# SECURITY.md
# CODEOWNERS
# CI
# package-lock.json
# GitHub security features
#
# Never weaken application compatibility merely to eliminate an update notice.
#
# =============================================================================
# LOCKFILE POLICY
# =============================================================================
#
# The Gaming Horizon application uses:
#
# THE-GAMING-HORIZON/package.json
# THE-GAMING-HORIZON/package-lock.json
#
# Dependency updates should keep both files synchronized.
#
#
# EXPECTED
# --------
#
# THE-GAMING-HORIZON/package.json
#                 |
#                 v
# THE-GAMING-HORIZON/package-lock.json
#                 |
#                 v
#              npm ci
#                 |
#                 v
#               BUILD
#
#
# INVALID
# -------
#
# package.json
#      |
#      X
# package-lock.json
#      |
#      v
# npm ci FAILURE
#
# =============================================================================
# CURRENT ECOSYSTEMS
# =============================================================================
#
# Do not add ecosystem blocks simply for appearance.
#
# Current Dependabot ecosystems:
#
# - npm
# - github-actions
#
# Additional ecosystems should only be added if the repository actually begins
# using them.
#
# Possible future examples:
#
# - docker
# - pip
# - maven
# - gradle
#
# =============================================================================
# APPLICATION LOCATION
# =============================================================================
#
# Repository:
#
# The-Gaming-Horizon/
#
# Main application:
#
# The-Gaming-Horizon/
# |
# +-- .github/
# +-- assets/
# +-- docs/
# +-- THE-GAMING-HORIZON/
# |   |
# |   +-- app/
# |   +-- components/
# |   +-- lib/
# |   +-- public/
# |   +-- supabase/
# |   +-- package.json
# |   +-- package-lock.json
# |   +-- next.config.mjs
# |   +-- postcss.config.mjs
# |   +-- proxy.ts
# |   +-- tsconfig.json
# |
# +-- README.md
# +-- ROADMAP.md
# +-- SECURITY.md
# +-- netlify.toml
#
# Dependabot npm monitoring therefore targets:
#
# /THE-GAMING-HORIZON
#
# GitHub Actions monitoring targets:
#
# /
#
# =============================================================================
# MAINTAINER POLICY
# =============================================================================
#
# Dependabot configuration should be reviewed when:
#
# - package manager changes;
# - repository structure changes;
# - manifests move;
# - dependency volume increases;
# - update frequency becomes excessive;
# - new workflow systems are introduced;
# - dependency policies change;
# - security requirements evolve.
#
